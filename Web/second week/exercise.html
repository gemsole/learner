<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>web</title>
    <link rel="stylesheet" href="./exercise.css">
</head>
<body>
    <form>
    <div class="outside-box">
        <span style="padding:10px">24012953-毛银平</span>
    <div class="login-box">
        <div>
            <span style="font-size: 24px;padding:10px;font-weight: bold;">
                欢迎注册
            </span>
            <br>
            <span style="font-size: 14px;padding:10px;">
                以字母开头，支持字母和数字组合
            </span>
        </div>
        <div class="input-box">
            <input type="text" placeholder="邮箱地址" class="text">

        </div>
        <div class="input-box">
            <label><input type="password" placeholder="密码" class="text"></label>
        </div>
        <div class="input-box">
            <label><input type="text" placeholder="手机号码" class="text"></label>
        </div>

        <div class="commit">
            <label><input type='checkbox' class="checkbox">同意《服务条款》、《隐私政策》和《儿童隐私政策》</label>
        </div>
        <div class="login-box">
            <label><input type="submit" value="注册" class="login"></label>
        </div>
    </div>
    </div>
    </form>
