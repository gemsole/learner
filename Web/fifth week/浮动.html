<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>float 浮动演示</title>
    <style>
        .box {
            width: 400px;
            border: 2px solid #333;
            padding: 10px;
        }
        .img-left {
            width: 120px;
            height: 80px;
            background: #4285f4;
            float: left;
            margin: 0 10px 5px 0;
        }        
        .img-right {
            width: 120px;
            height: 80px;
            background: #ea4335;
            float: right;
            margin: 0 0 5px 10px;
        }

    </style>
</head>
<body>
    <h3>float:left 图片左浮动，文字环绕</h3>
    <div class="box">
        <div class="img-left"></div>
        <p>这是一段文字，蓝色方块向左浮动，文字会自动环绕在浮动元素的右侧。</p>
    </div>

    <h3>float:right 图片右浮动，文字环绕</h3>
    <div class="box">
        <div class="img-right"></div>
        <p>红色方块向右浮动，文字自动跑到左边环绕它。</p>
    </div>
</body>
</html>
