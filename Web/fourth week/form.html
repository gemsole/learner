<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>classroom</title>
    <link rel="stylesheet" href="./demo.css">
</head>
<body>
    <form method="post">
        <div style="width:230px;">
            <h1 align="center">注册</h1>

        <label for="username">账号:</label>
        <input type="text" name="username" id="username" placeholder="必填">
        <br>
        <label for="password">密码:</label>
        <input type="password" name="password" id="password" placeholder="必填">
        <br>
        <label for="male">性别:</label>
        <input type="radio" name="gender" id="male">
        <label for="male" name="male">男</label>
        <input type="radio" name="gender" id="female">
        <label for="female">女</label>
        <br>
        <label for="email">邮箱:</label>
        <input type="email" name="email" id="email" placeholder="必填">
        <br>
        <label for="phone">电话:</label>
        <input type="tel" name="phone" id="phone" placeholder="必填">
        </div>

</body>
</html>
